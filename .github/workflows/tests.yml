name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package (editable, dev extra)
        run: pip install -e ".[dev]"

      - name: Run test suite (excluding slow CP-SAT/long-rollout tests)
        run: pytest -m "not slow" -q

      - name: Re-verify known optima
        run: python scripts/verify_optima.py
